name: appbreak
publish_to: none
description: A local-first break companion with optional community activity updates.
version: 0.6.0+6
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  html: ^0.15.7
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/activities.json
    - assets/activity_visuals/
